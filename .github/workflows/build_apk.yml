name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: festivalbuddy-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-android
          target_commitish: ${{ github.sha }}
          name: "Festival Buddy Android APK"
          body: "🚀 Latest Android release build of Festival Buddy. Download `app-release.apk` below and install directly onto any Android phone."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
